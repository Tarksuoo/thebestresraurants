[build]
  publish = "."
  command = ""

[[headers]]
  for = "/supabase/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/tools/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
